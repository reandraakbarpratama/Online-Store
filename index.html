<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toko Online Modern</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins',sans-serif}

body{
background:
linear-gradient(rgba(0,0,0,0.85),rgba(0,0,0,0.95)),
url("https://images.unsplash.com/photo-1512436991641-6745cdb1723f?w=1600");
background-size:cover;
color:white;
scroll-behavior:smooth;
}

/* NAV */
nav{
display:flex;
justify-content:space-between;
padding:15px 30px;
background:black;
position:sticky;
top:0;
z-index:1000;
}
.logo{color:gold;font-weight:bold}
.menu a{margin:0 10px;color:white;text-decoration:none}

/* HERO */
.hero{
text-align:center;
padding:100px 20px;
}
.hero h1{color:gold;font-size:40px}

/* SEARCH */
.search{text-align:center;margin-bottom:20px}
.search input{
padding:10px;
border-radius:20px;
border:none;
width:250px;
}

/* KATEGORI */
.kategori{text-align:center;margin-bottom:20px}
.kategori button{
margin:5px;
padding:8px 15px;
border-radius:20px;
border:1px solid gold;
background:transparent;
color:gold;
cursor:pointer;
}

/* PRODUK */
.container{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
padding:20px;
}

.product{
background:#1a1a1a;
padding:10px;
border-radius:15px;
text-align:center;
cursor:pointer;
}

.product img{
width:100%;
height:200px;
object-fit:contain;
background:#111;
border-radius:10px;
transition:0.3s;
}
.product img:hover{transform:scale(1.05)}

.product button{
margin-top:5px;
padding:8px;
background:gold;
border:none;
border-radius:10px;
cursor:pointer;
}

/* CART */
#cart{
position:fixed;
right:20px;
bottom:20px;
width:320px;
background:rgba(20,20,20,0.9);
backdrop-filter:blur(15px);
padding:20px;
border-radius:20px;
box-shadow:0 10px 40px rgba(0,0,0,0.6);
display:none;
}

#cart h3 span{
float:right;
cursor:pointer;
}

.remove-btn{
background:red;
border:none;
color:white;
padding:3px 7px;
border-radius:6px;
cursor:pointer;
}

.checkout{
width:100%;
margin-top:10px;
padding:10px;
background:linear-gradient(45deg,gold,orange);
border:none;
border-radius:10px;
}

.clear-cart{
width:100%;
margin-top:5px;
padding:8px;
border:1px solid red;
color:red;
background:transparent;
border-radius:10px;
}

/* MODAL */
#modal{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,0.8);
display:none;
justify-content:center;
align-items:center;
}

#modal-content{
background:#1a1a1a;
padding:20px;
border-radius:15px;
width:300px;
text-align:center;
}
</style>
</head>

<body>

<!-- NAV -->
<nav>
<div class="logo">🛍️ TOM </div>
<div class="menu">
<a href="#home">Beranda</a>
<a href="#produk">Produk</a>
<a href="#kontak">Kontak</a>
<a href="#" onclick="toggleCart()">🛒</a>
</div>
</nav>

<!-- HERO -->
<section id="home" class="hero">
<h1>Toko Online Modern</h1>
<p>Belanja gaya premium</p>
</section>

<!-- PRODUK -->
<section id="produk">

<div class="search">
<input type="text" id="search" placeholder="Cari produk...">
</div>

<div class="kategori">
<button onclick="filterProduk('all')">Semua</button>
<button onclick="filterProduk('fashion')">Fashion</button>
<button onclick="filterProduk('aksesoris')">Aksesoris</button>
</div>

<div class="container" id="product-list"></div>

</section>

<!-- KONTAK -->
<section id="kontak" style="text-align:center;padding:50px">
<h2>Kontak</h2>
<p>WhatsApp: 0812-6040-3448</p>
<p>Email: toko@reandraakbarpratamaxtkj@gmail.com </p>
</section>

<!-- CART -->
<div id="cart">
<h3>🛒 Keranjang <span onclick="toggleCart()">✖</span></h3>
<ul id="cart-items"></ul>
<p>Total: Rp <span id="total">0</span></p>

<button class="checkout">Checkout</button>
<button class="clear-cart" onclick="clearCart()">Hapus Semua</button>
</div>

<!-- MODAL -->
<div id="modal">
<div id="modal-content"></div>
</div>

<script>
const products=[
{id:1,name:"Kemeja Premium",price:100000,category:"fashion",img:"https://images.unsplash.com/photo-1602810318383-e386cc2a3ccf?w=1000"},
{id:2,name:"Sepatu Sport",price:150000,category:"fashion",img:"https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=1000"},
{id:3,name:"Jaket Stylish",price:250000,category:"fashion",img:"https://images.unsplash.com/photo-1521223890158-f9f7c3d5d504?w=1000"},
{id:4,name:"Topi Keren",price:30000,category:"aksesoris",img:"https://images.unsplash.com/photo-1521369909029-2afed882baee?w=1000"},
{id:5,name:"Jam Tangan",price:200000,category:"aksesoris",img:"https://images.unsplash.com/photo-1524592094714-0f0654e20314?w=1000"},
{id:6,name:"Tas Casual",price:120000,category:"aksesoris",img:"https://images.unsplash.com/photo-1584917865442-de89df76afd3?w=1000"}
];

let cart=[];
let currentFilter="all";

/* RENDER */
function renderProducts(){
const container=document.getElementById("product-list");
container.innerHTML="";
const keyword=document.getElementById("search").value.toLowerCase();

products
.filter(p=>currentFilter==="all"||p.category===currentFilter)
.filter(p=>p.name.toLowerCase().includes(keyword))
.forEach(p=>{
container.innerHTML+=`
<div class="product" onclick="openDetail(${p.id})">
<img src="${p.img}">
<h4>${p.name}</h4>
<p>Rp ${p.price.toLocaleString()}</p>
<button onclick="event.stopPropagation(); addToCart(${p.id})">Tambah</button>
</div>`;
});
}

/* FILTER */
function filterProduk(k){currentFilter=k;renderProducts()}
document.getElementById("search").addEventListener("input",renderProducts);

/* CART */
function toggleCart(){
const cartBox=document.getElementById("cart");
cartBox.style.display=cartBox.style.display==="block"?"none":"block";
}

function addToCart(id){
const product=products.find(p=>p.id===id);
cart.push(product);
renderCart();
document.getElementById("cart").style.display="block";
}

function renderCart(){
const list=document.getElementById("cart-items");
let total=0;
list.innerHTML="";

cart.forEach((item,index)=>{
list.innerHTML+=`
<li>
${item.name}
<button class="remove-btn" onclick="removeItem(${index})">x</button>
</li>`;
total+=item.price;
});

document.getElementById("total").innerText=total.toLocaleString();
}

function removeItem(i){
cart.splice(i,1);
renderCart();
}

function clearCart(){
cart=[];
renderCart();
}

/* MODAL */
function openDetail(id){
const p=products.find(x=>x.id===id);
document.getElementById("modal-content").innerHTML=`
<img src="${p.img}" style="width:100%;border-radius:10px">
<h3>${p.name}</h3>
<p>Rp ${p.price.toLocaleString()}</p>
<button onclick="addToCart(${p.id})">Tambah</button>
<br><br>
<button onclick="closeModal()">Tutup</button>
`;
document.getElementById("modal").style.display="flex";
}

function closeModal(){
document.getElementById("modal").style.display="none";
}

renderProducts();
</script>

</body>
</html>
